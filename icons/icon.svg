<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6"/>

  <!-- Decorative Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#27272a" stroke-width="3" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Chess Knight Symbol (Left / Gold) -->
  <g transform="translate(180, 230) scale(0.65)" filter="url(#glow)">
    <path d="M-40,80 C-40,80 40,80 40,80 C40,70 30,60 20,50 C40,40 50,20 40,-10 C35,-25 20,-35 25,-60 C26,-65 20,-70 15,-70 C5,-70 -10,-55 -25,-40 C-35,-30 -50,-20 -55,0 C-60,20 -40,50 -40,80 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Xiangqi General Kanji Symbol (Right / Rose) -->
  <g transform="translate(340, 230)">
    <circle cx="0" cy="0" r="55" fill="#1c1917" stroke="url(#roseGrad)" stroke-width="5" filter="url(#glow)"/>
    <text x="0" y="20" font-family="'Segoe UI', 'Noto Sans SC', sans-serif" font-size="56" font-weight="900" fill="url(#roseGrad)" text-anchor="middle">將</text>
  </g>

  <!-- Brand Label -->
  <text x="256" y="420" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">BOARDVERSE</text>
  <text x="256" y="455" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="url(#goldGrad)" letter-spacing="6" text-anchor="middle">AI ARENA</text>
</svg>